<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Traffic Filter Lab</title>
    <style>
      :root { color-scheme: dark; font-family: Inter, system-ui, sans-serif; }
      body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #08111f; color: #e5edf8; }
      main { width: min(760px, calc(100% - 40px)); }
      .tag { color: #67e8f9; letter-spacing: .12em; text-transform: uppercase; font-size: .75rem; }
      h1 { margin: .6rem 0; font-size: clamp(2.2rem, 8vw, 4.8rem); line-height: .98; }
      p { color: #a9b8cd; font-size: 1.05rem; line-height: 1.6; }
      code { color: #a7f3d0; }
      .flow { margin-top: 2rem; padding-top: 1.5rem; border-top: 1px solid #23324a; }
    </style>
  </head>
  <body>
    <main>
      <div class="tag">Linux · Docker · Netfilter</div>
      <h1>Traffic Filter Lab</h1>
      <p>A small reproducible lab for Docker network segmentation and host-level traffic filtering.</p>
      <p class="flow"><code>client → edge → internal app → isolated data network</code></p>
    </main>
  </body>
</html>
